name: Hive end-to-end

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hivemind
          POSTGRES_PASSWORD: hivemind
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U hivemind -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HIVE_E2E_ADMIN_URL: postgres://hivemind:hivemind@127.0.0.1:54329/postgres
      HIVE_E2E_EVIDENCE: /tmp/hive-e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable the repository pnpm version
        run: npm install --global corepack@0.34.6 && corepack enable && corepack install
      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Run harness safety checks
        run: pnpm --filter @hivemind/e2e test
      - name: Run deterministic PR scenarios
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: pnpm e2e:fast
      - name: Run the complete deterministic matrix
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm e2e:full
      - name: Save synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-e2e-${{ github.run_id }}
          path: |
            /tmp/hive-e2e/report.*
            /tmp/hive-e2e/config-fingerprints.json
            /tmp/hive-e2e/*/*.json
            /tmp/hive-e2e/*/*.jsonl
            /tmp/hive-e2e/*/*.log
          retention-days: 7
